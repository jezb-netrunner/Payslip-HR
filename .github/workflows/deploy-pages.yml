# Build the Vite SPA and deploy it to GitHub Pages.
# One-time repo setting: Settings → Pages → Source = "GitHub Actions"
# (configure-pages below also tries to enable it automatically).
name: Deploy to GitHub Pages

# Deploys run from main only — the github-pages environment restricts
# deployments to the default branch. Use workflow_dispatch for manual runs.
# Actions are pinned to commits (a moved tag can't change what runs here);
# Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the payroll engine and the edge functions' unit tests
      - name: Run tests
        run: npm test

      - name: Build (served under /Payslip-HR/ on Pages)
        run: npm run build -- --base=/Payslip-HR/

      # GitHub Pages has no SPA rewrites: serving the app as the 404 page
      # keeps deep links like /admin/payroll working on refresh.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

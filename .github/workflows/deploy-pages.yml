# Build the Vite SPA and deploy it to GitHub Pages.
# One-time repo setting: Settings → Pages → Source = "GitHub Actions"
# (configure-pages below also tries to enable it automatically).
name: Deploy to GitHub Pages

# Deploys run from main only — the github-pages environment restricts
# deployments to the default branch. Use workflow_dispatch for manual runs.
# Actions are pinned to commits (a moved tag can't change what runs here);
# Dependabot proposes updates (.github/dependabot.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # lint, tests, build and the SQL / RLS suite (ci.yml) before anything deploys
  checks:
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # the payroll engine and the edge functions' unit tests
      - name: Run tests
        run: npm test

      - name: Build (served under /Payslip-HR/ on Pages)
        run: npm run build -- --base=/Payslip-HR/

      # GitHub Pages has no SPA rewrites: serving the app as the 404 page
      # keeps deep links like /admin/payroll working on refresh.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

# Build the Vite SPA and deploy it to GitHub Pages.
# One-time repo setting: Settings → Pages → Source = "GitHub Actions"
# (configure-pages below also tries to enable it automatically).
name: Deploy to GitHub Pages

# Deploys run from main only — the github-pages environment restricts
# deployments to the default branch. Use workflow_dispatch for manual runs.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run payroll engine tests
        run: npm test

      - name: Build (served under /Payslip-HR/ on Pages)
        run: npm run build -- --base=/Payslip-HR/

      # GitHub Pages has no SPA rewrites: serving the app as the 404 page
      # keeps deep links like /admin/payroll working on refresh.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
